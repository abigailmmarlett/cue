name: Checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A new push to a PR replaces its running checks; every master commit gets a full run.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # The database tests use Node's built-in SQLite, so .nvmrc pins a Node that has it.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Bundle for iOS
        run: npx expo export --platform ios --output-dir dist
